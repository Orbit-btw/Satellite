name: Release

on:
  push:
    branches:
      - main
    paths:
      - 'Cargo.toml'

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
      should_release: ${{ steps.check.outputs.SHOULD_RELEASE }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed to fetch all tags
      
      - name: Get version from Cargo.toml
        id: get_version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          VERSION=$(grep '^version = ' Cargo.toml | head -1 | cut -d '"' -f 2)
          echo "VERSION=v$VERSION" >> $GITHUB_OUTPUT
          
      - name: Check if tag exists
        id: check
        run: |
          if git ls-remote --tags origin | grep "refs/tags/${{ steps.get_version.outputs.VERSION }}$" >/dev/null 2>&1; then
            echo "Version ${{ steps.get_version.outputs.VERSION }} already exists as a tag. Skipping release."
            echo "SHOULD_RELEASE=false" >> $GITHUB_OUTPUT
          else
            echo "Version ${{ steps.get_version.outputs.VERSION }} is new. Creating release!"
            echo "SHOULD_RELEASE=true" >> $GITHUB_OUTPUT
            git tag ${{ steps.get_version.outputs.VERSION }}
            git push origin ${{ steps.get_version.outputs.VERSION }}
          fi

  build-and-release:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    name: Build release on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: sat.exe
            asset_name: sat-windows-amd64.exe
          - os: ubuntu-latest
            artifact_name: sat
            asset_name: sat-linux-amd64
          - os: macos-latest
            artifact_name: sat
            asset_name: sat-macos-amd64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release

      - name: Rename executable for upload
        shell: bash
        run: |
          mv target/release/${{ matrix.artifact_name }} target/release/${{ matrix.asset_name }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-version.outputs.version }}
          name: Release ${{ needs.check-version.outputs.version }}
          files: target/release/${{ matrix.asset_name }}
          generate_release_notes: true
