[package]
name = "sat-cli"
version = "0.2.0"
edition = "2024"
description = "A universal package manager wrapper and TUI dashboard for Windows developers"
repository = "https://github.com/Orbit-btw/Satellite"
license = "MIT"

[[bin]]
name = "sat"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.4", features = ["derive"] }
crossterm = "0.29.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.43.0", features = ["full", "process"] }
